<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before & After</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background: #f2f2f2;
        }

        header {
            background: #222;
            color: white;
            text-align: center;
            padding: 25px;
        }

        .search-box {
            text-align: center;
            margin: 25px;
        }

        #search {
            width: 60%;
            padding: 12px;
            font-size: 16px;
            border: 1px solid #aaa;
            border-radius: 8px;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 25px;
            flex-wrap: wrap;
            padding: 20px;
        }

        .card {
            background: white;
            width: 300px;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 3px 10px rgba(0,0,0,0.2);
        }

        .card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h2 {
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>Before & After Gallery</h1>
        <p>Search and view our transformations</p>
    </header>

    <div class="search-box">
        <input 
            type="text" 
            id="search" 
            placeholder="Search here..."
            onkeyup="searchItems()"
        >
    </div>

    <div class="container" id="gallery">

        <div class="card">
            <img src="before1.jpg">
            <h2>Room Makeover</h2>
            <p>Before and after room transformation.</p>
        </div>

        <div class="card">
            <img src="before2.jpg">
            <h2>Garden</h2>
            <p>Before and after garden improvement.</p>
        </div>

        <div class="card">
            <img src="before3.jpg">
            <h2>Computer Setup</h2>
            <p>Before and after gaming setup.</p>
        </div>

        <div class="card">
            <img src="before4.jpg">
            <h2>Motorcycle</h2>
            <p>Before and after motorcycle modification.</p>
        </div>

    </div>

    <script>
        function searchItems() {

            let input = document
                .getElementById("search")
                .value
                .toLowerCase();

            let cards = document.querySelectorAll(".card");

            cards.forEach(function(card) {

                let text = card.innerText.toLowerCase();

                if (text.includes(input)) {
                    card.style.display = "block";
                } else {
                    card.style.display = "none";
                }

            });
        }
    </script>

</body>
</html>
